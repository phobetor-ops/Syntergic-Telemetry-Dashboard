name: Syntergic Cloud Sentinel (OSINT + Telegram EWS)

on:
  push:
    branches:
      - main
  schedule:
    # Vigilancia continua cada 30 min para Zero-Days (CVSS >= 9.0) y emergencias críticas
    - cron: '*/30 * * * *'
    # Reporte Diario Global a las 08:00 AM Hora Argentina (11:00 UTC)
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      target_job:
        description: 'Seleccionar reporte a enviar a Telegram'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - sentinel
          - digest
      force_notify:
        description: 'Forzar envío inmediato a Telegram ignorando caché'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: syntergic-ews-pages-${{ github.workflow }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONUNBUFFERED: '1'
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  sentinel:
    name: Job 1 - 7-Front OSINT Sentinel & Telegram Dispatcher
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Restore Seen Spikes Deduplication Cache
        uses: actions/cache@v4
        with:
          path: backend/.cache
          key: syntergic-sentinel-cache-${{ github.run_id }}
          restore-keys: |
            syntergic-sentinel-cache-

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute 7-Front Sentinel & Dispatch to Telegram
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.target_job }}"
            if [ -z "$MODE" ]; then MODE="both"; fi
            python backend/cloud_sentinel.py --mode "$MODE" --force-notify
          elif [ "${{ github.event_name }}" = "push" ]; then
            python backend/cloud_sentinel.py --mode both --force-notify
          else
            python backend/cloud_sentinel.py --mode sentinel
          fi

      - name: Upload Live 7-Front OSINT Snapshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-osint-snapshot
          path: frontend/public/live-osint-snapshot.json
          if-no-files-found: warn

  digest:
    name: Job 2 - Daily 08:00 ART Global Panorama Digest
    needs: [sentinel]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      always() &&
      (needs.sentinel.result == 'success' || needs.sentinel.result == 'skipped') &&
      (github.event_name == 'schedule' && github.event.schedule == '0 11 * * *')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Daily 08:00 ART Panorama Digest Delivery
        run: python backend/cloud_sentinel.py --mode digest

  deploy_pages:
    name: Job 3 - Build & Deploy Live Dashboard to GitHub Pages
    needs: [sentinel]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Live 7-Front OSINT Snapshot
        uses: actions/download-artifact@v4
        with:
          name: live-osint-snapshot
          path: frontend/public
        continue-on-error: true

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Configure GitHub Pages
        id: pages_config
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Install Frontend Dependencies & Build Static Export
        working-directory: frontend
        env:
          GITHUB_PAGES: 'true'
        run: |
          npm ci
          npm run build
          touch out/.nojekyll

      - name: Upload GitHub Pages Artifact
        if: steps.pages_config.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

      - name: Deploy to GitHub Pages
        if: steps.pages_config.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
