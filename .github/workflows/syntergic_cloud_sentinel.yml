name: Syntergic EWS Cloud Sentinel, Telegram & GitHub Pages Deploy

on:
  push:
    branches:
      - main
  schedule:
    # Vigilancia continua cada 30 min para Zero-Days (CVSS >= 9.0) y emergencias críticas
    - cron: '30 * * * *'
    - cron: '0 0-10,12-23 * * *'
    # Reporte Diario Global a las 08:00 AM Hora Argentina (11:00 UTC)
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      target_job:
        description: 'Select which Syntergic Cloud job to trigger manually'
        required: true
        default: 'both'
        type: choice
        options:
          - sentinel
          - digest
          - both
      force_notify:
        description: 'Ignore deduplication cache and force alert for all current RED spikes'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: syntergic-ews-pages-${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONUNBUFFERED: '1'
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  sentinel:
    name: Job 1 - 7-Front OSINT Sentinel & Snapshot Generator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Restore Seen Spikes Deduplication Cache
        uses: actions/cache@v4
        with:
          path: backend/.cache
          key: syntergic-sentinel-cache-${{ github.run_id }}
          restore-keys: |
            syntergic-sentinel-cache-

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute 7-Front Sentinel & Export Live Snapshot for GitHub Pages
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python backend/cloud_sentinel.py --mode export-only
          elif [ "${{ github.event.inputs.force_notify }}" = "true" ]; then
            python backend/cloud_sentinel.py --mode sentinel --force-notify
          else
            python backend/cloud_sentinel.py --mode sentinel
          fi

      - name: Upload Live 7-Front OSINT Snapshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-osint-snapshot
          path: frontend/public/live-osint-snapshot.json
          if-no-files-found: warn

  digest:
    name: Job 2 - Daily 7-Front Global Entropy Panorama Digest
    needs: [sentinel]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      always() &&
      (needs.sentinel.result == 'success' || needs.sentinel.result == 'skipped') &&
      ((github.event_name == 'schedule' && github.event.schedule == '0 11 * * *') ||
       (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.target_job == 'digest' || github.event.inputs.target_job == 'both')))
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute 7-Front Global Panorama Digest Delivery
        run: python backend/cloud_sentinel.py --mode digest

  deploy_pages:
    name: Job 3 - Build & Deploy Live Dashboard to GitHub Pages
    needs: [sentinel]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Live 7-Front OSINT Snapshot
        uses: actions/download-artifact@v4
        with:
          name: live-osint-snapshot
          path: frontend/public
        continue-on-error: true

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Frontend Dependencies & Build Static Export
        working-directory: frontend
        env:
          GITHUB_PAGES: 'true'
        run: |
          npm ci
          npm run build
          touch out/.nojekyll

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
