version: '3.8'

services:
  # ============================================================================
  # SYNTERGIC MESSAGE BROKER & IN-MEMORY CACHE
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: syntergic-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - syntergic-net

  # ============================================================================
  # FASTAPI BACKEND (ZERO TRUST DISPATCHER & WEBSOCKET BROADCASTER)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: syntergic-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - LOG_LEVEL=INFO
      - SIMULATION_INTERVAL_SECONDS=4
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - syntergic-net

  # ============================================================================
  # CELERY WORKER (LOGOS ENGINE & SENSOR PROCESSING)
  # ============================================================================
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: syntergic-worker
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - LOG_LEVEL=INFO
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A celery_app.celery worker --loglevel=info --concurrency=2
    networks:
      - syntergic-net

  # ============================================================================
  # CELERY BEAT (PERIODIC OSINT SENSOR INGESTION TRIGGER)
  # ============================================================================
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: syntergic-beat
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - LOG_LEVEL=INFO
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A celery_app.celery beat --loglevel=info
    networks:
      - syntergic-net

  # ============================================================================
  # NEXT.JS FRONTEND (SYNTERGIC SOC TELEMETRY DASHBOARD)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: syntergic-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/telemetry
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - syntergic-net

networks:
  syntergic-net:
    driver: bridge

volumes:
  redis_data:
    driver: local
